<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#145a41"/>
      <stop offset="1" stop-color="#06150f"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf2bd"/>
      <stop offset="1" stop-color="#2fd08a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#3ddc97" stroke-opacity="0.35" stroke-width="4"/>
  <!-- A prompt that points the way Arabic is read: right to left. -->
  <path d="M 322 128 L 182 232 L 322 336" fill="none" stroke="url(#fg)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor -->
  <rect x="196" y="388" width="130" height="38" rx="19" fill="#f2c14e"/>
  <!-- nuqta, the Arabic dot -->
  <circle cx="378" cy="232" r="27" fill="#f2c14e"/>
</svg>
