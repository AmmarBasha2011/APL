examples:
  - changed-files:
      - any-glob-to-any-file: ["examples/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", "scripts/**", "ruff.toml"]
libraries:
  - changed-files:
      - any-glob-to-any-file: ["core/libraries/**"]
core:
  - changed-files:
      - any-glob-to-any-file: ["core/**", "!core/libraries/**"]
