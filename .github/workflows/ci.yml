name: CI

# يفحص كل push على main وكل PR:
#   1) سلامة المكتبات (حلّ المسارات + التحويل + التكرار + التصادم)
#   2) نظافة الريبو (compileall + اتساق النسخة والأرقام + التحميل الكسول + بلوكات README)
#   3) كل الأمثلة (تشغيل + مخرجات متوقعة)
#
# نفس الخطوات بالظبط اللي في scripts/check.sh للاستخدام المحلي.
#
# الحد الأدنى المدعوم هو Python 3.14 (انظر README). لإضافة نسخ حاجبة
# تانية، أضفها في قائمة matrix — وإلا خليها في الـ job غير الحاجب تحت.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: الفحوص (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: سلامة المكتبات
        run: python scripts/check_libraries.py
      - name: نظافة الريبو واتساق التوثيق
        run: python scripts/check_repo.py
      - name: الأمثلة
        run: python test_examples.py

  # نسخة أحدث من الحد الأدنى: بتحمي من انحراف المكتبة القياسية قبل ما
  # يطلع فعلاً، لكنها non-blocking حتى لا تقفل أي PR إذا الاسم الجديد مش
  # موجود في setup-python أو لو في اختلافات بسيطة.
  next-python:
    name: نسخة مستقبلية (غير حاجبة)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: فحص المكتبات على النسخة الأحدث
        run: python scripts/check_libraries.py
      - name: الأمثلة على النسخة الأحدث
        run: python test_examples.py
