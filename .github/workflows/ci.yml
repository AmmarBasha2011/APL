name: CI

# يفحص كل push على main وكل PR:
#   1) سلامة المكتبات (حلّ المسارات + التحويل + التكرار + التصادم)
#   2) نظافة الريبو (compileall + اتساق النسخة والأرقام + التحميل الكسول + بلوكات README)
#   3) كل الأمثلة (تشغيل + مخرجات متوقعة)
#
# نفس الخطوات بالظبط اللي في scripts/check.sh للاستخدام المحلي.
#
# الحد الأدنى المدعوم هو Python 3.14 (انظر README). لإضافة نسخ حاجبة
# تانية، أضفها في قائمة matrix — وإلا خليها في الـ job غير الحاجب تحت.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: الفحوص (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: تثبيت الحزم الخارجية
        run: pip install -r requirements.txt
      - name: سلامة المكتبات
        run: python scripts/check_libraries.py
      - name: نظافة الريبو واتساق التوثيق
        run: python scripts/check_repo.py
      - name: الأمثلة
        run: python test_examples.py

  # نسخة أحدث من الحد الأدنى: بتحمي من انحراف المكتبة القياسية قبل ما
  # يطلع فعلاً. غير حاجبة عمداً — الانحراف هنا معروفة ومتوقَّعة (مثلاً
  # CGIHTTPRequestHandler اتشال في 3.15)، فبتظهر كتحذير على الـ PR مش كـ ✗ أحمر.
  next-python:
    name: نسخة مستقبلية (غير حاجبة)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
      - name: تثبيت الحزم الخارجية
        # بعض الإصدارات المثبتة (نفس نسخ السيرفر) تعلن Requires-Python أقدم
        # من النسخة المستقبلية — مثل agent-client-protocol==0.9.0 (<3.15).
        # الحزمة pure-python فالقيد احترازي؛ نتجاوزه هنا فقط (job غير حاجب)
        # علشان الفحص يشتغل بنفس الإصدارات المثبتة بدل ما يفشل التثبيت.
        run: pip install -r requirements.txt --ignore-requires-python
      - name: فحص المكتبات على النسخة الأحدث
        run: |
          if python scripts/check_libraries.py; then
            echo "✓ مفيش انحراف في النسخة المستقبلية"
          else
            echo "::warning title=انحراف المكتبة القياسية::في أسماء اتشالت أو اتغيّرت في النسخة الأحدث — راجع سجل الخطوة دي"
          fi
      - name: الأمثلة على النسخة الأحدث
        run: |
          if python test_examples.py; then
            echo "✓ الأمثلة كلها شغالة على النسخة الأحدث"
          else
            echo "::warning title=الأمثلة على النسخة الأحدث::بعض الأمثلة فشلت — راجع السجل"
            python test_examples.py || true
          fi

  # فحص أخطاء حقيقية في الكود (ruff: صياغة + أسماء غير معرفة)
  lint:
    name: فحص الكود (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check core scripts

  # فحص ثغرات حزم pip المعروفة — غير حاجب حالياً: يُظهر الثغرات
  # كتحذيرات دون إفشال الـ PR، لأن معالجة النسخ المثبتة القديمة تتطلب
  # تحديث mappings المكتبات المتأثرة (tornado و pillow وغيرها) — عمل مستقل.
  pip-audit:
    name: فحص ثغرات الحزم (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  # تغطية توثيق المكتبات: كل مكتبة لها ملف وكل عنصر مدرج فيه
  docs-coverage:
    name: تغطية التوثيق
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_docs.py

  # سلامة الروابط النسبية في ملفات Markdown
  md-links:
    name: روابط التوثيق
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/check_md_links.py
