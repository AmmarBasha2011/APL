name: Language platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export_editor_index.py --check
      - run: python -m build
      - name: Clean wheel install and multi-file application
        run: |
          python -m venv /tmp/apl-clean
          /tmp/apl-clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/apl-clean/bin/apl --version
          /tmp/apl-clean/bin/apl check "$GITHUB_WORKSPACE/projects/taskbook/main.apl"
          /tmp/apl-clean/bin/apl run "$GITHUB_WORKSPACE/projects/taskbook/main.apl" /tmp/tasks.db add 'CI task'
          /tmp/apl-clean/bin/apl run "$GITHUB_WORKSPACE/projects/taskbook/main.apl" /tmp/tasks.db list
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test editors/vscode/test/*.test.js
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: docker build -f playground/Dockerfile -t apl-playground:local .
      - run: APL_DOCKER_TESTS=1 python -m unittest discover -s tests -p test_sandbox.py -v
