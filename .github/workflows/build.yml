name: بناء الملفات التنفيذية

# يدوي بالكامل: من تبويب Actions اختر "بناء الملفات التنفيذية" ثم Run workflow.
# لينكس بيتبني على Ubuntu 22.04 (glibc 2.35) علشان الملف يشتغل على توزيعات أقدم.
# ينتج ملف تنفيذي للويندوز (.exe) وللينكس ولماك (Apple Silicon وIntel).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "لو كتبت وسم (مثل v1.0.0-alpha.1) هيتنشر Release تجريبي (Alpha) بالملفات. سيبه فاضي للبناء بس."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: لينكس
            artifact: APL-linux
            ext: ""
          - os: windows-latest
            name: ويندوز
            artifact: APL-windows
            ext: ".exe"
          # ماك: بيتبني ويتجرب في CI بس، ومحدش جربه بإيده، وغير موقّع.
          - os: macos-latest
            name: ماك (Apple Silicon)
            artifact: APL-macos-arm64
            ext: ""
          - os: macos-15-intel
            name: ماك (Intel)
            artifact: APL-macos-intel
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نسخة من التوثيق (للتشغيل بدون نت)
        uses: actions/checkout@v4
        with:
          repository: AmmarBasha2011/APL-Docs
          path: docs-src

      - name: تثبيت أدوات البناء
        run: |
          python -m pip install --upgrade pip pyinstaller tzdata

      - name: بناء الملف التنفيذي
        run: python tools/build_exe.py

      - name: تجهيز الحزمة
        shell: bash
        run: |
          set -euo pipefail
          ext="${{ matrix.ext }}"
          mkdir -p package
          cp "dist/apl$ext" "package/عمار$ext"
          cp "dist/apl$ext" "package/apl$ext"
          mkdir -p package/APL-Docs
          cp -r docs-src/docs docs-src/README.md package/APL-Docs/
          # One launcher per tool. English sub-command names keep the files ASCII.
          for pair in "Terminal:terminal" "REPL:repl" "Libraries:libraries" "Docs:docs" "Examples:examples" "Benchmark:benchmark"; do
            label="${pair%%:*}"; sub="${pair##*:}"
            if [ "${{ matrix.artifact }}" = "APL-windows" ]; then
              printf '@echo off\r\nchcp 65001 >nul\r\n"%%~dp0apl.exe" %s %%*\r\nif errorlevel 1 pause\r\n' "$sub" > "package/APL-$label.cmd"
            else
              # .command opens in Terminal when double-clicked on a Mac.
              suffix=sh; case "${{ matrix.artifact }}" in APL-macos*) suffix=command;; esac
              printf '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./apl %s "$@"\n' "$sub" > "package/APL-$label.$suffix"
              chmod +x "package/APL-$label.$suffix"
            fi
          done
          {
            printf 'APL - لغة عمار البرمجية\n\n'
            printf 'تشغيل برنامج:   عمار شغل برنامج.apl\n'
            printf 'المساعدة:       عمار مساعدة\n'
            printf 'المكتبات:       عمار مكتبة قائمة\n\n'
            printf 'نسخة Alpha: أكيد فيها أخطاء.\n'
            case "${{ matrix.artifact }}" in APL-macos*)
              printf 'ماك: النسخة دي اتبنت واتجربت في CI بس، ومحدش جربها بإيده، وهي غير موقّعة.\n'
              printf 'لو ماك رفض يفتحها: xattr -dr com.apple.quarantine <مجلد الحزمة>\n'
              printf 'وبعدين دوس على APL-*.command.\n';;
            esac
            printf 'البرامج المرافقة (دوس مرتين على الملف):\n'
            printf '  APL-Terminal   طرفية عادية بتعرض العربي صح\n'
            printf '  APL-REPL       جرب الأوامر مباشرة\n'
            printf '  APL-Libraries  المكتبات المعتمدة (في المتصفح)\n'
            printf '  APL-Docs       التوثيق بدون نت، وبيتزامن مع الريبو لما فيه نت\n'
            printf '  APL-Examples   تصفح الأمثلة وانسخها وشغلها\n'
            printf '  APL-Benchmark  قياس سرعة APL\n'
          } > "package/اقرأني.txt"

      - name: اختبار الملف التنفيذي
        shell: bash
        run: |
          set -euo pipefail
          ext="${{ matrix.ext }}"
          printf 'اطبع "أهلاً من الملف التنفيذي"\n' > hello.apl
          "./package/apl$ext" نسخة
          "./package/apl$ext" شغل hello.apl
          "./package/apl$ext" مكتبة قائمة | head -n 1
          "./package/apl$ext" فحص hello.apl

      - name: اختبار البرامج المرافقة
        shell: bash
        run: |
          set -euo pipefail
          ext="${{ matrix.ext }}"
          python tools/smoke_apps.py "$PWD/package/apl$ext"

      - name: رفع الملفات
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/*
          if-no-files-found: error

  release:
    name: نشر Release تجريبي
    needs: build
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: ضغط الحزم
        run: |
          set -euo pipefail
          mkdir -p out
          # A checkout is needed for the zip helper only.
          python3 "$GITHUB_WORKSPACE/tools/make_zip.py" artifacts/APL-linux "out/APL-linux-${{ inputs.release_tag }}.zip" --unix
          python3 "$GITHUB_WORKSPACE/tools/make_zip.py" artifacts/APL-macos-arm64 "out/APL-macos-arm64-${{ inputs.release_tag }}.zip" --unix
          python3 "$GITHUB_WORKSPACE/tools/make_zip.py" artifacts/APL-macos-intel "out/APL-macos-intel-${{ inputs.release_tag }}.zip" --unix
          python3 "$GITHUB_WORKSPACE/tools/make_zip.py" artifacts/APL-windows "out/APL-windows-${{ inputs.release_tag }}.zip"
          (cd out && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: نشر الـ Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" out/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "APL ${{ inputs.release_tag }} (Alpha)" \
            --prerelease \
            --notes "نسخة Alpha: أكيد فيها أخطاء. ويندوز ولينكس وماك. نسخة الماك (Apple Silicon وIntel) اتبنت واتجربت في CI بس، ومحدش جربها بإيده، وهي غير موقّعة. كل حزمة فيها ملف APL التنفيذي (عمار) ومعاه APL-Terminal وAPL-REPL وAPL-Libraries وAPL-Docs وAPL-Examples وAPL-Benchmark. فك الضغط ودوس مرتين على اللي عايزه."
