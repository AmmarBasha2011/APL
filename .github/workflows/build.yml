name: بناء الملفات التنفيذية

# يدوي بالكامل: من تبويب Actions اختر "بناء الملفات التنفيذية" ثم Run workflow.
# لينكس بيتبني على Ubuntu 22.04 (glibc 2.35) علشان الملف يشتغل على توزيعات أقدم.
# ينتج ملف تنفيذي للويندوز (.exe) وللينكس ولماك (Apple Silicon وIntel).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "لو كتبت وسم (مثل v1.0.0-alpha.1) هيتنشر Release تجريبي (Alpha) بالملفات. سيبه فاضي للبناء بس."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: لينكس
            artifact: APL-linux
            ext: ""
          - os: windows-latest
            name: ويندوز
            artifact: APL-windows
            ext: ".exe"
          # ماك: بيتبني ويتجرب في CI بس، ومحدش جربه بإيده، وغير موقّع.
          - os: macos-latest
            name: ماك (Apple Silicon)
            artifact: APL-macos-arm64
            ext: ""
          - os: macos-15-intel
            name: ماك (Intel)
            artifact: APL-macos-intel
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نسخة من التوثيق (للتشغيل بدون نت)
        uses: actions/checkout@v4
        with:
          repository: AmmarBasha2011/APL-Docs
          path: docs-src

      - name: تثبيت أدوات البناء
        run: |
          python -m pip install --upgrade pip pyinstaller tzdata

      - name: بناء الملف التنفيذي
        run: python tools/build_exe.py

      - name: تجهيز الحزمة
        shell: bash
        run: |
          set -euo pipefail
          ext="${{ matrix.ext }}"
          mkdir -p package
          cp "dist/apl$ext" "package/عمار$ext"
          cp "dist/apl$ext" "package/apl$ext"
          mkdir -p package/APL-Docs
          cp -r docs-src/docs docs-src/README.md package/APL-Docs/
          # One launcher per tool. English sub-command names keep the files ASCII.
          for pair in "Terminal:terminal" "REPL:repl" "Libraries:libraries" "Docs:docs" "Examples:examples" "Benchmark:benchmark"; do
            label="${pair%%:*}"; sub="${pair##*:}"
            if [ "${{ matrix.artifact }}" = "APL-windows" ]; then
              printf '@echo off\r\nchcp 65001 >nul\r\n"%%~dp0apl.exe" %s %%*\r\nif errorlevel 1 pause\r\n' "$sub" > "package/APL-$label.cmd"
            else
              # .command opens in Terminal when double-clicked on a Mac.
              suffix=sh; case "${{ matrix.artifact }}" in APL-macos*) suffix=command;; esac
              printf '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./apl %s "$@"\n' "$sub" > "package/APL-$label.$suffix"
              chmod +x "package/APL-$label.$suffix"
            fi
          done
          {
            printf 'APL - لغة عمار البرمجية\n\n'
            printf 'تشغيل برنامج:   عمار شغل برنامج.apl\n'
            printf 'المساعدة:       عمار مساعدة\n'
            printf 'المكتبات:       عمار مكتبة قائمة\n\n'
            printf 'نسخة Alpha: أكيد فيها أخطاء.\n'
            case "${{ matrix.artifact }}" in APL-macos*)
              printf 'ماك: النسخة دي اتبنت واتجربت في CI بس، ومحدش جربها بإيده، وهي غير موقّعة.\n'
              printf 'لو ماك رفض يفتحها: xattr -dr com.apple.quarantine <مجلد الحزمة>\n'
              printf 'وبعدين دوس على APL-*.command.\n';;
            esac
            printf 'البرامج المرافقة (دوس مرتين على الملف):\n'
            printf '  APL-Terminal   طرفية عادية بتعرض العربي صح\n'
            printf '  APL-REPL       جرب الأوامر مباشرة\n'
            printf '  APL-Libraries  المكتبات المعتمدة (في المتصفح)\n'
            printf '  APL-Docs       التوثيق بدون نت، وبيتزامن مع الريبو لما فيه نت\n'
            printf '  APL-Examples   تصفح الأمثلة وانسخها وشغلها\n'
            printf '  APL-Benchmark  قياس سرعة APL\n'
          } > "package/اقرأني.txt"

      - name: اختبار الملف التنفيذي
        shell: bash
        run: |
          set -euo pipefail
          ext="${{ matrix.ext }}"
          printf 'اطبع "أهلاً من الملف التنفيذي"\n' > hello.apl
          "./package/apl$ext" نسخة
          "./package/apl$ext" شغل hello.apl
          "./package/apl$ext" مكتبة قائمة | head -n 1
          "./package/apl$ext" فحص hello.apl

      - name: اختبار البرامج المرافقة
        shell: bash
        run: |
          set -euo pipefail
          ext="${{ matrix.ext }}"
          python tools/smoke_apps.py "$PWD/package/apl$ext"

      - name: رقم الإصدار
        id: ver
        shell: bash
        run: |
          tag="${{ inputs.release_tag }}"
          version="${tag#v}"
          [ -n "$version" ] || version="1.0.0-dev"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ---------- ويندوز: مثبّت Inno Setup ----------
      - name: مثبّت ويندوز
        if: matrix.artifact == 'APL-windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install innosetup -y --no-progress
          mkdir -p package/icons installer
          for d in assets/icons/*/; do n=$(basename "$d"); [ -f "$d/$n.ico" ] && cp "$d/$n.ico" "package/icons/$n.ico"; done
          export MSYS_NO_PATHCONV=1
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$ISCC" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$(cygpath -w "$PWD/package")" "/DOutDir=$(cygpath -w "$PWD/installer")" packaging/apl.iss
          ls -la installer

      - name: اختبار مثبّت ويندوز
        if: matrix.artifact == 'APL-windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem installer\APL-Setup-*.exe).FullName
          $dir = "C:\APL-test"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/TASKS=associate" -Wait
          foreach ($f in "apl.exe","icons\apl.ico","APL-Docs\README.md") { if (-not (Test-Path "$dir\$f")) { throw "missing $f" } }
          if (-not (Test-Path "$dir\عمار.exe")) { throw "missing عمار.exe" }
          $userPath = [Environment]::GetEnvironmentVariable("Path","User")
          if (($userPath -split ";") -notcontains $dir) { throw "PATH not updated: $userPath" }
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\APL"
          foreach ($n in "Terminal","REPL","Libraries","Docs","Examples","Benchmark") {
            if (-not (Test-Path "$menu\APL $n.lnk")) { throw "missing shortcut APL $n" }
            $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$menu\APL $n.lnk")
            if ($lnk.IconLocation -notlike "*icons*") { throw "shortcut APL $n has no icon: $($lnk.IconLocation)" }
          }
          & "$dir\apl.exe" نسخة
          python tools/smoke_apps.py "$dir\apl.exe"
          if ($LASTEXITCODE -ne 0) { throw "installed apps failed" }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          # the Inno uninstaller hands off to a temporary copy of itself, so wait for the files to go
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\apl.exe"); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\apl.exe") { throw "uninstall left apl.exe" }
          $after = [Environment]::GetEnvironmentVariable("Path","User")
          if (($after -split ";") -contains $dir) { throw "uninstall left PATH entry" }
          Write-Host "installer ok"

      # ---------- لينكس: حزمة .deb ----------
      - name: حزمة لينكس
        if: matrix.artifact == 'APL-linux'
        run: python tools/package_linux.py package "${{ steps.ver.outputs.version }}" installer

      - name: اختبار حزمة لينكس
        if: matrix.artifact == 'APL-linux'
        run: |
          set -euo pipefail
          sudo dpkg -i installer/*.deb
          apl نسخة
          عمار نسخة
          for n in terminal repl libraries docs examples benchmark; do
            test -f "/usr/share/applications/apl-$n.desktop"
            test -f "/usr/share/icons/hicolor/256x256/apps/apl-$n.png"
          done
          python tools/smoke_apps.py /usr/bin/apl
          sudo dpkg -r apl
          hash -r; if [ -e /usr/bin/apl ] || command -v apl; then echo "apl still on PATH after removal"; exit 1; fi

      # ---------- ماك: حزمة .pkg ----------
      - name: حزمة ماك
        if: startsWith(matrix.artifact, 'APL-macos')
        run: python3 tools/package_macos.py package "${{ steps.ver.outputs.version }}" "${{ matrix.artifact == 'APL-macos-arm64' && 'arm64' || 'intel' }}" installer

      - name: اختبار حزمة ماك
        if: startsWith(matrix.artifact, 'APL-macos')
        run: |
          set -euo pipefail
          sudo installer -pkg installer/*.pkg -target /
          /usr/local/bin/apl نسخة
          /usr/local/bin/عمار نسخة
          echo "$PATH" | tr ':' '\n' | grep -qx /usr/local/bin
          for n in Terminal REPL Libraries Docs Examples Benchmark; do
            app="/Applications/APL/APL $n.app"
            test -x "$app/Contents/MacOS/launcher"
            plutil -lint "$app/Contents/Info.plist"
            ls "$app/Contents/Resources/"*.icns
          done
          python3 tools/smoke_apps.py /usr/local/bin/apl

      - name: رفع المثبّتات
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer/*
          if-no-files-found: error

  release:
    name: نشر Release تجريبي
    needs: build
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: تجميع المثبّتات
        run: |
          set -euo pipefail
          mkdir -p out
          cp artifacts/*/* out/
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: نشر الـ Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" out/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "APL ${{ inputs.release_tag }} (Alpha)" \
            --prerelease \
            --notes "نسخة Alpha: أكيد فيها أخطاء. مثبّتات حقيقية: ويندوز (APL-Setup .exe)، لينكس (.deb)، وماك (.pkg لـ Apple Silicon وIntel). كلها بتضيف apl وعمار للـ PATH وبتعمل 6 برامج بأيقونات: Terminal وREPL وLibraries وDocs وExamples وBenchmark. المثبّتات غير موقّعة، واتجربت في CI بس ومحدش جربها بإيده (ويندوز: SmartScreen يطلب Run anyway، ماك: كليك يمين ثم Open)."
