name: Release

# عند دفع وسم v* (مثل v1.14) يُنشئ Release على GitHub بملاحظات
# مولّدة تلقائياً من الـ PRs والكوميتات. بلا نشر خارجي وبلا أسرار.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: إنشاء Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: إنشاء Release بملاحظات مولدة
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
