let pyodide = null;
let aplTranspiler = null;

function decodeBase64(str) {
  const bin = atob(str);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

async function initPyodide() {
  if (pyodide) return;
  setStatus('جاري تحميل Pyodide...', '');
  try {
    pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/' });
    const src = decodeBase64(APL_BASE64);
    const transpilerOnly = src.split('_RUNTIME = """')[0];
    await pyodide.runPythonAsync(transpilerOnly);
    aplTranspiler = true;
    setStatus('جاهز ✓', 'success');
  } catch (e) {
    setStatus('فشل تحميل Pyodide: ' + e.message, 'error');
    throw e;
  }
}

function setStatus(msg, cls) {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = cls || '';
}

function getCode() {
  return document.getElementById('code').value;
}

function setOutput(text, cls) {
  const out = document.getElementById('output');
  out.textContent = text;
  out.className = cls || '';
}

async function transpileCode() {
  try {
    setStatus('جار التحويل...', '');
    await initPyodide();
    const code = getCode();
    pyodide.globals.set('__apl_input', code);
    await pyodide.runPythonAsync(`
import sys, io
sys.stdout = io.StringIO()
__apl_result = transpile(__apl_input)
`);
    const result = pyodide.globals.get('__apl_result');
    setOutput(result, '');
    setStatus('تم التحويل ✓', 'success');
  } catch (e) {
    setOutput('خطأ: ' + e.message, 'error');
    setStatus('فشل التحويل', 'error');
  }
}

async function runCode() {
  try {
    setStatus('جار التشغيل...', '');
    await initPyodide();

    // transpile
    const code = getCode();
    pyodide.globals.set('__apl_input', code);
    await pyodide.runPythonAsync(`
import sys, io, builtins as _b
__apl_py = transpile(__apl_input)
sys.stdout = io.StringIO()
`);
    const pyCode = pyodide.globals.get('__apl_py');

    // capture output
    pyodide.globals.set('__apl_pycode', pyCode);
    await pyodide.runPythonAsync(`
import sys, io, builtins as _b

_apl_out = io.StringIO()

def _apl_print(*a, **kw):
    _apl_out.write(' '.join(_b.str(x) for x in a) + chr(10))

_old_print = _b.print
_b.print = _apl_print

__apl_globals = {}
try:
    _b.exec(__apl_pycode, __apl_globals)
except Exception as _e:
    _apl_out.write(_b.str(_e))

_b.print = _old_print
__apl_result = _apl_out.getvalue()
`);

    const outText = pyodide.globals.get('__apl_result');
    setOutput(outText, '');
    setStatus('تم ✓', 'success');
  } catch (e) {
    setOutput('خطأ: ' + e.message, 'error');
    setStatus('فشل التشغيل', 'error');
  }
}

function clearOutput() {
  setOutput('', '');
  setStatus('جاهز ✓', 'success');
}

        المتغير ب = عشري(ادخل("أدخل الرقم الثاني: "))

        لو اختيار == 1:
            اطبع "النتيجة:", أ + ب
        الا لو اختيار == 2:
            اطبع "النتيجة:", أ - ب
        الا لو اختيار == 3:
            اطبع "النتيجة:", أ * ب
        الا لو اختيار == 4:
            لو ب != 0:
                اطبع "النتيجة:", أ / ب
            الا:
                اطبع "خطأ: القسمة على صفر"
    الا لو اختيار == 5:
        اطبع "مع السلامة"
        ارجع
    الا:
        اطبع "اختيار غير صحيح"

آلة_حاسبة()`;
  setOutput('', '');
  setStatus('تم تحميل المثال', 'success');
}
</script>
