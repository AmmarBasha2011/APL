[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ammar-apl"
version = "1.13"
description = "APL: Arabic programming with a Python backend"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
apl = "core.apl_runner.cli:main"

[project.optional-dependencies]
web = ["fastapi", "flask", "requests", "aiohttp", "uvicorn"]
science = ["numpy", "scipy"]
bots = ["python-telegram-bot", "redis", "celery"]
dev = ["coverage", "build", "ruff"]

[tool.setuptools.packages.find]
include = ["core", "core.*"]

[tool.setuptools.package-data]
"core.libraries" = ["registry.json"]
